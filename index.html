<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Adrián Pardo Hair Studio · Acceso</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root {
        --cream: #dbcbb8;
        --ink: #211c1a;
        --sage: #8aa194;
        --muted: rgba(219, 203, 184, 0.62);
        --line: rgba(219, 203, 184, 0.18);
        color: var(--cream);
        background: var(--ink);
        font-family: "Jost", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 300;
      }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(100% - 2.5rem, 30rem); padding: 3rem 0; text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 2rem; display: block; }
      .lbl { font-size: 0.62rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--sage); margin-bottom: 1.2rem; }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-weight: 300;
        font-size: clamp(2.3rem, 9vw, 3.2rem);
        line-height: 1.05;
      }
      h1 i { display: block; color: #fff; }
      p { margin: 1.4rem 0 2rem; color: var(--muted); line-height: 1.6; }
      .status { min-height: 1.5rem; margin-bottom: 1.8rem; font-size: 0.85rem; color: var(--muted); }
      .status::before {
        content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 0.6rem;
        vertical-align: middle; border-radius: 50%; background: var(--sage);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .status.done::before { animation: none; }
      @keyframes pulse { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .status::before { animation: none; } }
      .links { display: grid; gap: 0.7rem; }
      a {
        display: block; padding: 1.05rem 1rem;
        font-size: 0.66rem; letter-spacing: 0.28em; text-transform: uppercase;
        color: var(--ink); background: var(--cream); text-decoration: none;
        border: 1px solid var(--cream); transition: background 0.3s, color 0.3s;
      }
      a:hover { background: #fff; }
      a.secondary { color: var(--cream); background: transparent; border-color: var(--line); }
      a.secondary:hover { border-color: var(--cream); }
      a:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; }
      .wa { margin-top: 2.4rem; font-size: 0.8rem; color: var(--muted); }
      .wa a { display: inline; padding: 0; border: 0; background: none; color: var(--cream); letter-spacing: 0; text-transform: none; font-size: 0.8rem; text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="favicon.png" alt="" width="72" height="72" />
      <div class="lbl">Adrián Pardo · Hair Studio</div>
      <h1>Menos ruido,<i>más intención.</i></h1>
      <p>Estoy buscando la ruta más rápida para abrir la web.</p>
      <div class="status" id="status" role="status" aria-live="polite">Comprobando disponibilidad…</div>
      <div class="links">
        <a id="go-primary" href="https://adrian-pardo.pages.dev/">Abrir la web</a>
        <a id="go-mirror" class="secondary" href="https://adrian-pardo.netlify.app/">Abrir la copia de respaldo</a>
      </div>
      <div class="wa">¿No carga ninguna? Escríbeme por <a href="https://wa.me/34677427724">WhatsApp</a>.</div>
    </main>

    <script>
      // ── Configuración ─────────────────────────────────────────────
      // PRIMARY: la web en Cloudflare (cuando el dominio esté traspasado,
      //          cambiar por https://www.adrianpardohairstudio.com/).
      // MIRROR:  copia en Netlify (fuera de Cloudflare) para cuando LaLiga
      //          bloquea las IPs de Cloudflare.
      const PRIMARY = "https://adrian-pardo.pages.dev/";
      const MIRROR = "https://adrian-pardo.netlify.app/";
      const PROBE = "favicon.png";
      const TIMEOUT_MS = 3500;
      const status = document.querySelector("#status");

      // ?ir=cita.html → lleva a esa página dentro de la web (solo rutas relativas)
      const params = new URLSearchParams(location.search);
      const raw = params.get("ir") || "";
      const path = /^[a-z0-9][a-z0-9\-./]*(\.html)?$/i.test(raw) && !raw.includes("..") ? raw : "";
      const target = (host) => host + path + location.hash;
      document.querySelector("#go-primary").href = target(PRIMARY);
      document.querySelector("#go-mirror").href = target(MIRROR);

      function reachable(url) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          const timeout = setTimeout(() => { image.src = ""; reject(new Error("timeout")); }, TIMEOUT_MS);
          image.onload = () => { clearTimeout(timeout); resolve(); };
          image.onerror = () => { clearTimeout(timeout); reject(new Error("unavailable")); };
          image.src = `${url}${PROBE}?gateway-check=${Date.now()}`;
        });
      }

      Promise.allSettled([reachable(PRIMARY), reachable(MIRROR)]).then(([primary, mirror]) => {
        const destination = primary.status === "fulfilled" ? PRIMARY : mirror.status === "fulfilled" ? MIRROR : null;
        status.classList.add("done");
        if (!destination) {
          status.textContent = "No he podido comprobar ninguna ruta. Prueba con uno de los botones.";
          return;
        }
        status.textContent = destination === PRIMARY ? "Web disponible. Abriendo…" : "Abriendo la copia de respaldo…";
        window.setTimeout(() => window.location.replace(target(destination)), 250);
      });
    </script>
  </body>
</html>
